<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Audacious Minds</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- Custom cursor -->
  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <!-- Background -->
  <div class="bg-noise"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="deco-line"></div>

  <main>
    <!-- Badge -->
    <div class="badge">
      <span class="badge-dot"></span>
      Mindfulness
    </div>

    <!-- Brand Name -->
    <div class="brand">
      <span class="brand-word brand-word-1">Audacious</span>
      <span class="brand-word brand-word-2">Minds</span>
      <p class="brand-sub">Creative | Growth | Wellness</p>
    </div>

    <!-- Connect heading -->
    <h2 class="connect-heading">
      Let's <em>Connect</em>
    </h2>

    <!-- Social Cards -->
    <div class="cards">

      <!-- Instagram -->
      <a href="https://instagram.com/audacious_mnds" target="_blank" rel="noopener" class="card card-ig">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="20" height="20" rx="5.5" stroke="#E8153A" stroke-width="1.8"/>
            <circle cx="12" cy="12" r="4.5" stroke="#FF6B9D" stroke-width="1.8"/>
            <circle cx="17.5" cy="6.5" r="1" fill="#E8153A"/>
          </svg>
        </div>
        <p class="card-platform">Instagram</p>
        <div class="card-divider"></div>
        <p class="card-handle">@audacious_mnds</p>
        <div class="card-cta">
          Follow us
          <svg viewBox="0 0 12 12" fill="none">
            <path d="M2 6h8M7 3l3 3-3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </a>

      <!-- TikTok -->
      <a href="https://tiktok.com/@audacious_mnds" target="_blank" rel="noopener" class="card card-tt">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5" stroke="#FF6B9D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <p class="card-platform">TikTok</p>
        <div class="card-divider"></div>
        <p class="card-handle">@audacious_mnds</p>
        <div class="card-cta">
          Follow us
          <svg viewBox="0 0 12 12" fill="none">
            <path d="M2 6h8M7 3l3 3-3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </a>

    </div>

    <!-- Footer tagline -->
    <div class="tagline">
      <p>Made with <span>♥</span> by eVisionary Solutions &mdash; 2025</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
